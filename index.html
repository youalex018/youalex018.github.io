<body>
  <script>
    (function () {
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      if (location.pathname === '/writing' || location.pathname.indexOf('/writing/') === 0) {
        document.documentElement.dataset.surface = 'writing';
      }
      document.documentElement.dataset.mode = 'orbit';
      document.documentElement.style.setProperty('--chrome-ink', '#f8fafc');
      document.documentElement.style.setProperty('--chrome-muted', '#e2e8f0');
    })();
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
