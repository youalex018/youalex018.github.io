<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#030712" />
  <meta name="description" content="Alex You's Computer Engineering Portfolio" />
  <title>Alex You | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
</head>

<body>
  <script>
    (function () {
      var DEFAULT_MODE = 'orbit';
      var STORAGE_KEY = 'alex:view-mode';
      var params = new URLSearchParams(location.search);
      var fromUrl = params.get('view');
      var mode = fromUrl === 'ascent' || fromUrl === 'orbit' ? fromUrl : null;
      if (!mode) {
        try { mode = localStorage.getItem(STORAGE_KEY); } catch (e) {}
      }
      if (mode !== 'ascent' && mode !== 'orbit') mode = DEFAULT_MODE;
      document.documentElement.dataset.mode = mode;
      if (mode === 'orbit') {
        /* Keep in sync with COCKPIT_PROGRESS in src/data/modes.js */
        document.documentElement.style.setProperty('--progress', '0.82');
        document.documentElement.style.setProperty('--chrome-ink', '#f8fafc');
        document.documentElement.style.setProperty('--chrome-muted', '#e2e8f0');
      }
    })();
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
